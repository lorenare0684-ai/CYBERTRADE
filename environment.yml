# CYBERTRADE // NEON PROTOCOL — conda environment (Windows/Linux/macOS)
# Name: cybertrade
# Python: 3.11 (requires >=3.10, tested on 3.11)
# 100% standard library runtime — no third-party deps required
# tk provides tkinter for desktop GUI (python run_gui.py)
# pytest for the 593-test suite
#
# === WINDOWS QUICK START ===
#   1. Install Miniforge for Windows: https://github.com/conda-forge/miniforge
#      Download Miniforge3-Windows-x86_64.exe and install
#   2. Open Miniforge Prompt (or Anaconda Prompt) from Start Menu
#   3. cd /d C:\path\to\CYBERTRADE
#   4. conda env create -f environment.yml
#   5. conda activate cybertrade
#   6. python -m cybertrade doctor
#
# === LINUX/macOS QUICK START ===
#   conda env create -f environment.yml
#   conda activate cybertrade
#   python -m cybertrade doctor
#
# Usage after activation (all platforms):
#   python -m cybertrade web --port 8899 --auto  # browser HUD
#   python run_gui.py                            # desktop HUD
#   python -m unittest discover -s tests         # 593 tests
#
# Update:
#   conda env update -f environment.yml --prune
#
# Remove:
#   conda env remove -n cybertrade
#
name: cybertrade
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip>=23
  - tk=8.6  # tkinter support — Windows: included, Linux: provides tkinter
  - pytest>=7
  - pip:
    - -e .[dev]
