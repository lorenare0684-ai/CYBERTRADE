# CYBERTRADE // NEON PROTOCOL — conda environment (Miniconda)
# Name: cybertrade
# Python: 3.11 (requires >=3.10, tested on 3.11)
# 100% standard library runtime — no third-party deps required
# tk provides tkinter for desktop GUI (python run_gui.py)
# pytest for the 687-test suite
#
# === MINICONDA (Windows) QUICK START ===
#   1. Install Miniconda for Windows: https://docs.anaconda.com/miniconda/install/
#      Download Miniconda3-latest-Windows-x86_64.exe and install
#   2. Open Anaconda Prompt from Start Menu
#   3. cd /d C:\path\to\CYBERTRADE
#   4. conda env create -f environment.yml
#   5. conda activate cybertrade
#   6. python -m cybertrade doctor
#
# === MINICONDA (Linux/macOS) QUICK START ===
#   conda env create -f environment.yml
#   conda activate cybertrade
#   python -m cybertrade doctor
#
# Usage after activation (all platforms):
#   python -m cybertrade web --port 8899 --auto  # browser HUD
#   python run_gui.py                            # desktop HUD
#   python -m unittest discover -s tests         # 687 tests
#
# Update:
#   conda env update -f environment.yml --prune
#
# Remove:
#   conda env remove -n cybertrade
#
name: cybertrade
# conda-forge is listed first on purpose: every package here exists there,
# and putting it ahead of `defaults` avoids the mixed-channel priority solves
# that can stall for a very long time on a fresh Windows install.
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip>=23
  - tk=8.6
  - pytest>=7
  - pip:
    - -e .[dev]
