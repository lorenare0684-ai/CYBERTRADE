# CYBERTRADE // NEON PROTOCOL — full dev conda env (Windows/Linux/macOS)
# Name: cybertrade
# Includes additional dev tools for linting and coverage
#
# Windows: conda env create -f environment-dev.yml
# Linux/macOS: conda env create -f environment-dev.yml
name: cybertrade
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pip>=23
  - tk=8.6
  - pytest>=7
  - pytest-cov
  - black
  - ruff
  - mypy
  - pip:
    - -e .[dev]
