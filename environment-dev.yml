# CYBERTRADE // NEON PROTOCOL — dev conda env (Miniconda only)
# Name: cybertrade
# Includes additional dev tools
#
# Windows: conda env create -f environment-dev.yml
# Linux/macOS: conda env create -f environment-dev.yml
name: cybertrade
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.11
  - pip>=23
  - tk=8.6
  - pytest>=7
  - pytest-cov
  - black
  - ruff
  - mypy
  - pip:
    - -e .[dev]
