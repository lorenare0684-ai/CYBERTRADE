[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cybertrade"
version = "1.0.0"
description = "CYBERTRADE // NEON PROTOCOL — all-weather cyberpunk trading terminal with unofficial Quotex integration"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CYBERTRADE" }]
keywords = ["trading", "binary-options", "quotex", "cyberpunk", "bot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial :: Investment",
    "Intended Audience :: Education",
]
dependencies = []   # 100% standard library

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
cybertrade = "cybertrade.cli:main"

[tool.setuptools.packages.find]
include = ["cybertrade*"]

[tool.setuptools.package-data]
"cybertrade.web" = ["static/*", "static/css/*", "static/js/*"]
